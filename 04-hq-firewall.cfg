! ============================================================
! HQ-FW — Hardveres tűzfal (HA aktív/passzív pár) — Székhely
! Cisco ASA-stílusú szintaxis; más gyártónál (FortiGate/Palo Alto/pfSense)
! a logika azonos, csak a parancsszintaxis tér el.
! Zónák: outside (Internet) / wan1-mpls / dmz / inside1+inside2 (LAN felé) / guest
! ============================================================
hostname HQ-FW
!
failover
failover lan unit primary
failover lan interface FAILOVER GigabitEthernet0/3
failover interface ip FAILOVER 172.16.99.1 255.255.255.252 standby 172.16.99.2
!
! --- Interfészek ---
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.1 255.255.255.240 standby 203.0.113.2
!
interface GigabitEthernet0/1
 description to HQ-R1 (MPLS gerinc)
 nameif wan1-mpls
 security-level 40
 ip address 10.255.2.1 255.255.255.248 standby 10.255.2.3
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 10.1.90.1 255.255.255.240 standby 10.1.90.3
!
interface GigabitEthernet1/0
 description to CORE-SW1 (inside1)
 nameif inside1
 security-level 100
 ip address 10.255.3.1 255.255.255.248 standby 10.255.3.3
!
interface GigabitEthernet1/1
 description to CORE-SW2 (inside2)
 nameif inside2
 security-level 100
 ip address 10.255.3.9 255.255.255.248 standby 10.255.3.11
!
interface Loopback0
 ip address 10.255.255.5 255.255.255.255
!
! ============================================================
! NAT (8. fejezet — statikus + dinamikus)
! ============================================================
object network DMZ-WEB
 host 10.1.90.2
object network LAN-ALL
 subnet 10.0.0.0 255.0.0.0
!
nat (dmz,outside) source static DMZ-WEB 203.0.113.10
nat (any,outside) source dynamic LAN-ALL interface
!
! ============================================================
! Zóna-alapú hozzáférési szabályzat (13. fejezet táblázata)
! ============================================================
object-group network GUEST-NET
 network-object 10.1.80.0 255.255.255.0
!
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 443
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 80
access-list OUTSIDE-IN extended permit udp any host 203.0.113.1 eq 500
access-list OUTSIDE-IN extended permit udp any host 203.0.113.1 eq 4500
access-list OUTSIDE-IN extended permit esp any host 203.0.113.1
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.1 eq 443
access-list OUTSIDE-IN extended deny ip any any log
access-group OUTSIDE-IN in interface outside
!
access-list DMZ-IN extended permit tcp host 10.1.90.2 10.1.20.0 255.255.255.0 eq 443
access-list DMZ-IN extended deny ip any any log
access-group DMZ-IN in interface dmz
!
access-list GUEST-OUT extended deny ip object-group GUEST-NET 10.0.0.0 255.0.0.0
access-list GUEST-OUT extended permit tcp object-group GUEST-NET any eq 443
access-list GUEST-OUT extended permit tcp object-group GUEST-NET any eq 80
access-list GUEST-OUT extended permit udp object-group GUEST-NET any eq 53
access-list GUEST-OUT extended deny ip object-group GUEST-NET any log
access-list GUEST-OUT extended permit ip any any
access-group GUEST-OUT in interface inside1
access-group GUEST-OUT in interface inside2
!
! ============================================================
! Site-to-site VPN — IPsec VTI (10.1. fejezet)
! ============================================================
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 lifetime seconds 86400
!
crypto ipsec ikev2 ipsec-proposal ESP-AES256-SHA256
 protocol esp encryption aes-256
 protocol esp integrity sha-256
!
crypto ipsec profile IPSEC-PROFILE
 set ikev2 ipsec-proposal ESP-AES256-SHA256
 set pfs group14
!
tunnel-group 203.0.113.50 type ipsec-l2l    ! Debreceni telephely publikus IP-je (placeholder)
tunnel-group 203.0.113.50 ipsec-attributes
 ikev2 remote-authentication pre-shared-key CHANGE-ME-DEBRECEN
 ikev2 local-authentication pre-shared-key CHANGE-ME-DEBRECEN
!
tunnel-group 203.0.113.60 type ipsec-l2l    ! Nyíregyházi telephely publikus IP-je (placeholder)
tunnel-group 203.0.113.60 ipsec-attributes
 ikev2 remote-authentication pre-shared-key CHANGE-ME-NYIREGYHAZA
 ikev2 local-authentication pre-shared-key CHANGE-ME-NYIREGYHAZA
!
interface Tunnel1
 description IPsec VTI — HQ <-> Debrecen (tartalék WAN)
 ip address 10.255.1.1 255.255.255.252
 tunnel source interface outside
 tunnel destination 203.0.113.50
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-PROFILE
!
interface Tunnel2
 description IPsec VTI — HQ <-> Nyíregyháza (tartalék WAN)
 ip address 10.255.1.5 255.255.255.252
 tunnel source interface outside
 tunnel destination 203.0.113.60
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-PROFILE
!
! ============================================================
! Remote-access (SSL) VPN — 10.2. fejezet
! ============================================================
webvpn
 enable outside
 anyconnect image disk0:/anyconnect-win-4.10.pkg 1
 anyconnect enable
!
ip local pool RA-VPN-POOL 10.1.250.10-10.1.250.200 mask 255.255.255.0
!
aaa-server NPS-RADIUS protocol radius
aaa-server NPS-RADIUS (inside1) host 10.1.20.10
 key CHANGE-ME-RADIUS
!
group-policy RA-POLICY internal
group-policy RA-POLICY attributes
 vpn-tunnel-protocol ssl-client
 split-tunnel-policy tunnelall
 address-pools value RA-VPN-POOL
!
tunnel-group RA-VPN type remote-access
tunnel-group RA-VPN general-attributes
 authentication-server-group NPS-RADIUS
 default-group-policy RA-POLICY
tunnel-group RA-VPN webvpn-attributes
 group-alias NorthLine-RA enable
!
! ============================================================
! OSPF — a tűzfal is részt vesz a 0. területben (LAN/MPLS oldal)
! ============================================================
router ospf 1
 router-id 10.255.255.5
 network 10.255.2.0 255.255.255.248 area 0
 network 10.255.3.0 255.255.255.248 area 0
 network 10.255.3.8 255.255.255.248 area 0
 network 10.255.255.5 255.255.255.255 area 0
 network 10.255.1.0 255.255.255.252 area 0
 network 10.255.1.4 255.255.255.252 area 0
!
logging host inside1 10.1.20.11    ! syslog -> LNX-SRV01
logging trap informational
!
end
