! ============================================================
! HQ-R1 — MPLS CE (Customer Edge) router — Székhely
! Szerep: elsődleges WAN-kapcsolat a szolgáltatói MPLS L3VPN fele
! Megjegyzés: a PE-oldali cím (198.51.100.2) a szolgáltató kezelésében áll,
! itt csak dokumentációs (RFC 5737 TEST-NET-2) placeholder.
! ============================================================
hostname HQ-R1
!
interface GigabitEthernet0/0
 description to MPLS-PE (szolgáltatói kézbesítés)
 ip address 198.51.100.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to HQ-FW (wan1-mpls)
 ip address 10.255.2.2 255.255.255.248
!
interface Loopback0
 ip address 10.255.255.11 255.255.255.255
!
! --- Statikus alapértelmezett útvonal a PE fele ---
ip route 0.0.0.0 0.0.0.0 198.51.100.2
!
! Megjegyzés: az OSPF a Gi0/0-n (PE-CE link) is aktív — a szolgáltató
! MPLS L3VPN-je OSPF-et futtat PE-CE protokollként (RFC 4577), és a
! backbone (0. terület) folytonosságát a saját BGP/MPLS gerincén
! keresztül biztosítja a telephelyek CE routerei között.
router ospf 1
 router-id 10.255.255.11
 default-information originate always
 network 198.51.100.0 0.0.0.3 area 0
 network 10.255.2.0 0.0.0.7 area 0
 network 10.255.255.11 0.0.0.0 area 0
!
line vty 0 15
 login local
 transport input ssh
!
end
