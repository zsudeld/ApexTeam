! ============================================================
! CORE-SW2 — NorthLine Logisztika Zrt. — Székhely
! Szerep: L3 core switch, HSRP STANDBY, LACP EtherChannel a CORE-SW1 fele
! ============================================================
hostname CORE-SW2
!
ip routing
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,60,70,80,90,99 priority 28672
!
vlan 10
 name MGMT
vlan 20
 name SERVER
vlan 30
 name ADMIN
vlan 40
 name SALES
vlan 50
 name LOGISTICS
vlan 60
 name VOIP
vlan 70
 name WIFI-STAFF
vlan 80
 name WIFI-GUEST
vlan 99
 name NATIVE-UNUSED
!
interface range GigabitEthernet1/0/1 - 2
 description to CORE-SW1 (LACP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
 channel-group 1 mode active
!
interface Port-channel1
 description LACP to CORE-SW1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
!
interface range GigabitEthernet1/0/3 - 12
 description to distribution/access switches (redundant uplink)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/1/1
 description to HQ-FW inside2 (routed)
 no switchport
 ip address 10.255.3.10 255.255.255.248
!
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
!
interface Vlan10
 ip address 10.1.10.3 255.255.255.0
 standby 10 ip 10.1.10.1
 standby 10 priority 90
 standby 10 preempt
!
interface Vlan20
 ip address 10.1.20.3 255.255.255.0
 standby 20 ip 10.1.20.1
 standby 20 priority 90
 standby 20 preempt
 ip access-group ACL-SERVER-MGMT out
!
interface Vlan30
 ip address 10.1.30.3 255.255.255.0
 standby 30 ip 10.1.30.1
 standby 30 priority 90
 standby 30 preempt
!
interface Vlan40
 ip address 10.1.40.3 255.255.255.0
 standby 40 ip 10.1.40.1
 standby 40 priority 90
 standby 40 preempt
!
interface Vlan50
 ip address 10.1.50.3 255.255.255.0
 standby 50 ip 10.1.50.1
 standby 50 priority 90
 standby 50 preempt
!
interface Vlan60
 ip address 10.1.60.3 255.255.255.0
 standby 60 ip 10.1.60.1
 standby 60 priority 90
 standby 60 preempt
!
interface Vlan70
 ip address 10.1.70.3 255.255.255.0
 standby 70 ip 10.1.70.1
 standby 70 priority 90
 standby 70 preempt
!
interface Vlan80
 ip address 10.1.80.3 255.255.255.0
 standby 80 ip 10.1.80.1
 standby 80 priority 90
 standby 80 preempt
 ip access-group ACL-GUEST-OUT in
!
ip access-list extended ACL-GUEST-OUT
 deny ip 10.1.80.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip 10.1.80.0 0.0.0.255 any
!
ip access-list extended ACL-SERVER-MGMT
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 22
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 3389
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 443
 deny   tcp any 10.1.20.0 0.0.0.255 eq 22
 deny   tcp any 10.1.20.0 0.0.0.255 eq 3389
 permit ip any 10.1.20.0 0.0.0.255
!
router ospf 1
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Port-channel1
 no passive-interface GigabitEthernet1/1/1
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.50.0 0.0.0.255 area 0
 network 10.1.60.0 0.0.0.255 area 0
 network 10.1.70.0 0.0.0.255 area 0
 network 10.1.80.0 0.0.0.255 area 0
 network 10.255.3.8 0.0.0.7 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
line vty 0 15
 login local
 transport input ssh
!
end
