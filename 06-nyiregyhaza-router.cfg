! ============================================================
! NYH-RTR — Nyíregyházi telephely router
! Elsődleges: MPLS CE. Tartalék: IPsec VTI a HQ-FW felé, IP SLA figyeléssel.
! ============================================================
hostname NYH-RTR
!
vlan 10
 name MGMT
vlan 30
 name ADMIN
vlan 60
 name VOIP
vlan 70
 name WIFI-STAFF
!
interface GigabitEthernet0/0
 description to MPLS-PE (szolgáltatói kézbesítés)
 ip address 198.51.100.9 255.255.255.252
!
interface GigabitEthernet0/1
 description helyi internet ISP (VPN tartalék forrás)
 ip address dhcp
!
interface Loopback0
 ip address 10.255.255.31 255.255.255.255
!
interface Vlan10
 ip address 10.3.10.1 255.255.255.240
!
interface Vlan30
 ip address 10.3.30.1 255.255.255.224
 ip helper-address 10.1.20.10
!
interface Vlan60
 ip address 10.3.60.1 255.255.255.240
 ip helper-address 10.1.20.10
!
interface Vlan70
 ip address 10.3.70.1 255.255.255.224
 ip helper-address 10.1.20.10
!
interface Tunnel1
 description IPsec VTI to HQ-FW (tartalék)
 ip address 10.255.1.6 255.255.255.252
 tunnel source GigabitEthernet0/1
 tunnel destination 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-PROFILE
!
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
!
crypto ipsec ikev2 ipsec-proposal ESP-AES256-SHA256
 protocol esp encryption aes-256
 protocol esp integrity sha-256
!
crypto ipsec profile IPSEC-PROFILE
 set ikev2 ipsec-proposal ESP-AES256-SHA256
!
ip sla 1
 icmp-echo 10.1.10.1 source-interface Vlan10
 frequency 5
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
!
ip route 0.0.0.0 0.0.0.0 Tunnel1 200 track 1
!
router ospf 1
 router-id 10.255.255.31
 area 2 stub no-summary
 passive-interface Vlan10
 passive-interface Vlan30
 passive-interface Vlan60
 passive-interface Vlan70
 network 198.51.100.8 0.0.0.3 area 0
 network 10.3.10.0 0.0.0.15 area 2
 network 10.3.30.0 0.0.0.31 area 2
 network 10.3.60.0 0.0.0.15 area 2
 network 10.3.70.0 0.0.0.31 area 2
 network 10.255.255.31 0.0.0.0 area 2
!
line vty 0 15
 login local
 transport input ssh
!
end
