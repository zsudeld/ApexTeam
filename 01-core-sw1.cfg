! ============================================================
! CORE-SW1 — NorthLine Logisztika Zrt. — Székhely
! Szerep: L3 core switch, HSRP AKTÍV, LACP EtherChannel a CORE-SW2 fele
! ============================================================
hostname CORE-SW1
!
ip routing
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,60,70,80,90,99 priority 24576
!
vlan 10
 name MGMT
vlan 20
 name SERVER
vlan 30
 name ADMIN
vlan 40
 name SALES
vlan 50
 name LOGISTICS
vlan 60
 name VOIP
vlan 70
 name WIFI-STAFF
vlan 80
 name WIFI-GUEST
vlan 99
 name NATIVE-UNUSED
!
! --- LACP EtherChannel a CORE-SW2 fele (2. ábra) ---
interface range GigabitEthernet1/0/1 - 2
 description to CORE-SW2 (LACP)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
 channel-group 1 mode active
!
interface Port-channel1
 description LACP to CORE-SW2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
!
! --- Elosztó/hozzáférési réteg felé trönk ---
interface range GigabitEthernet1/0/3 - 12
 description to distribution/access switches
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80
 switchport mode trunk
 spanning-tree bpduguard enable
!
! --- Routolt link a tűzfal felé (Inside1) ---
interface GigabitEthernet1/1/1
 description to HQ-FW inside1 (routed)
 no switchport
 ip address 10.255.3.2 255.255.255.248
!
interface Loopback0
 description OSPF router-id
 ip address 10.255.255.1 255.255.255.255
!
! --- VLAN SVI-k, HSRP AKTÍV ---
interface Vlan10
 description MGMT
 ip address 10.1.10.2 255.255.255.0
 standby 10 ip 10.1.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 track 1 decrement 30
!
interface Vlan20
 description SERVER
 ip address 10.1.20.2 255.255.255.0
 standby 20 ip 10.1.20.1
 standby 20 priority 110
 standby 20 preempt
 standby 20 track 1 decrement 30
 ip access-group ACL-SERVER-MGMT out
!
interface Vlan30
 description ADMIN
 ip address 10.1.30.2 255.255.255.0
 standby 30 ip 10.1.30.1
 standby 30 priority 110
 standby 30 preempt
 standby 30 track 1 decrement 30
!
interface Vlan40
 description SALES
 ip address 10.1.40.2 255.255.255.0
 standby 40 ip 10.1.40.1
 standby 40 priority 110
 standby 40 preempt
 standby 40 track 1 decrement 30
!
interface Vlan50
 description LOGISTICS
 ip address 10.1.50.2 255.255.255.0
 standby 50 ip 10.1.50.1
 standby 50 priority 110
 standby 50 preempt
 standby 50 track 1 decrement 30
!
interface Vlan60
 description VOIP
 ip address 10.1.60.2 255.255.255.0
 standby 60 ip 10.1.60.1
 standby 60 priority 110
 standby 60 preempt
 standby 60 track 1 decrement 30
!
interface Vlan70
 description WIFI-STAFF
 ip address 10.1.70.2 255.255.255.0
 standby 70 ip 10.1.70.1
 standby 70 priority 110
 standby 70 preempt
 standby 70 track 1 decrement 30
!
interface Vlan80
 description WIFI-GUEST
 ip address 10.1.80.2 255.255.255.0
 standby 80 ip 10.1.80.1
 standby 80 priority 110
 standby 80 preempt
 standby 80 track 1 decrement 30
 ip access-group ACL-GUEST-OUT in
!
! --- HSRP uplink figyelés ---
track 1 interface GigabitEthernet1/1/1 line-protocol
!
! --- ACL-ek (ld. vizsgaremek terv 12. fejezet) ---
ip access-list extended ACL-GUEST-OUT
 deny ip 10.1.80.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip 10.1.80.0 0.0.0.255 any
!
ip access-list extended ACL-SERVER-MGMT
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 22
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 3389
 permit tcp 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255 eq 443
 deny   tcp any 10.1.20.0 0.0.0.255 eq 22
 deny   tcp any 10.1.20.0 0.0.0.255 eq 3389
 permit ip any 10.1.20.0 0.0.0.255
!
! --- OSPF (0. terület, backbone) ---
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface Port-channel1
 no passive-interface GigabitEthernet1/1/1
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.50.0 0.0.0.255 area 0
 network 10.1.60.0 0.0.0.255 area 0
 network 10.1.70.0 0.0.0.255 area 0
 network 10.1.80.0 0.0.0.255 area 0
 network 10.255.3.0 0.0.0.7 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
line vty 0 15
 login local
 transport input ssh
!
end
