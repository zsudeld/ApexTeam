! ============================================================
! DEB-RTR — Debreceni telephely router
! Elsődleges: MPLS CE. Tartalék: IPsec VTI a HQ-FW felé, IP SLA figyeléssel.
! ============================================================
hostname DEB-RTR
!
vlan 10
 name MGMT
vlan 30
 name ADMIN
vlan 50
 name LOGISTICS
vlan 60
 name VOIP
vlan 70
 name WIFI-STAFF
!
interface GigabitEthernet0/0
 description to MPLS-PE (szolgáltatói kézbesítés)
 ip address 198.51.100.5 255.255.255.252
!
interface GigabitEthernet0/1
 description helyi internet ISP (VPN tartalék forrás)
 ip address dhcp
!
interface Loopback0
 ip address 10.255.255.21 255.255.255.255
!
! --- VLAN SVI-k + DHCP relay a székhelyi Windows DHCP fele ---
interface Vlan10
 ip address 10.2.10.1 255.255.255.224
!
interface Vlan30
 ip address 10.2.30.1 255.255.255.192
 ip helper-address 10.1.20.10
!
interface Vlan50
 ip address 10.2.50.1 255.255.255.128
 ip helper-address 10.1.20.10
!
interface Vlan60
 ip address 10.2.60.1 255.255.255.224
 ip helper-address 10.1.20.10
!
interface Vlan70
 ip address 10.2.70.1 255.255.255.192
 ip helper-address 10.1.20.10
!
! --- IPsec VTI a HQ-FW fele (tartalék WAN) ---
interface Tunnel1
 description IPsec VTI to HQ-FW (tartalék)
 ip address 10.255.1.2 255.255.255.252
 tunnel source GigabitEthernet0/1
 tunnel destination 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-PROFILE
!
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
!
crypto ipsec ikev2 ipsec-proposal ESP-AES256-SHA256
 protocol esp encryption aes-256
 protocol esp integrity sha-256
!
crypto ipsec profile IPSEC-PROFILE
 set ikev2 ipsec-proposal ESP-AES256-SHA256
!
! --- IP SLA — MPLS elérhetőség figyelése ---
ip sla 1
 icmp-echo 10.1.10.1 source-interface Vlan10
 frequency 5
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
!
! --- Lebegő statikus biztonsági mentés-útvonal (VPN alagúton) ---
ip route 0.0.0.0 0.0.0.0 Tunnel1 200 track 1
!
! --- OSPF — 1. terület, totally stubby ---
router ospf 1
 router-id 10.255.255.21
 area 1 stub no-summary
 passive-interface Vlan10
 passive-interface Vlan30
 passive-interface Vlan50
 passive-interface Vlan60
 passive-interface Vlan70
 network 198.51.100.4 0.0.0.3 area 0
 network 10.2.10.0 0.0.0.31 area 1
 network 10.2.30.0 0.0.0.63 area 1
 network 10.2.50.0 0.0.0.127 area 1
 network 10.2.60.0 0.0.0.31 area 1
 network 10.2.70.0 0.0.0.63 area 1
 network 10.255.255.21 0.0.0.0 area 1
!
line vty 0 15
 login local
 transport input ssh
!
end
